name: Deploy RealityLoop examples to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify simulation and TypeScript
        run: npm run check && npm test
      - name: Build project Pages site
        shell: bash
        run: |
          BASE="/${GITHUB_REPOSITORY#*/}/"
          echo "REALITYLOOP_PAGES_BASE=$BASE" >> "$GITHUB_ENV"
          npm run build:web -- --base "$BASE"
      - name: Verify deployable files and subpath links
        run: node --test tests/pages-build.test.mjs
      - name: Install Chromium for production runtime regression
        run: npx playwright install --with-deps chromium
      - name: Verify minified supermarket replay and PCL ICP
        env:
          REALITYLOOP_CAPTURE_NO_SANDBOX: '1'
          REALITYLOOP_CAPTURE_SWIFTSHADER: '1'
        run: npm run check:browser:prod
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Verify Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/realityloop-pages.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" != "200" ]; then
            echo "::error::GitHub Pages is not configured or accessible (HTTP $code). An administrator must open Settings > Pages > Build and deployment > Source: GitHub Actions. Then re-run this workflow. The default GITHUB_TOKEN cannot initialize Pages using configure-pages enablement."
            exit 1
          fi
          echo 'Pages configuration detected.'
      - uses: actions/configure-pages@v5
      - name: Publish Pages site
        id: deployment
        uses: actions/deploy-pages@v4
